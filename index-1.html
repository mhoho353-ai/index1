<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>FollowUp — Never forget a lead</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#111827;font-family:Arial,sans-serif}
.container{width:94%;max-width:700px;margin:auto;padding:18px 0 50px}
.header{background:#111827;color:#fff;padding:22px;border-radius:16px;margin-bottom:16px}
.header h1{margin:0 0 5px;font-size:29px}.header p{margin:0;color:#cbd5e1}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
h2{margin-top:0}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 15px;font-size:15px;cursor:pointer}
.primary{background:#111827;color:#fff;width:100%;margin-top:15px}
.secondary{background:#e5e7eb;color:#111827}
.success{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#991b1b}
.lead{border:1px solid #e5e7eb;border-radius:13px;padding:15px;margin-top:12px}
.lead h3{margin:0 0 7px;font-size:20px}
.meta{color:#6b7280;font-size:14px;margin:6px 0}
.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:bold;margin:5px 0}
.message{background:#f3f4f6;padding:13px;border-radius:10px;margin-top:10px;line-height:1.5}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;color:#6b7280;padding:20px}
.stats{display:flex;gap:10px}
.stat{flex:1;text-align:center;background:#f9fafb;border-radius:12px;padding:12px}
.stat strong{display:block;font-size:23px}
.notice{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:10px;z-index:10}
@media(max-width:450px){.stats{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>FollowUp</h1>
<p>Never forget a lead.</p>
</div>

<div class="card">
<h2>New Lead</h2>
<form id="leadForm">
<label>Customer name</label>
<input id="name" required placeholder="John Smith">

<label>Phone</label>
<input id="phone" inputmode="tel" placeholder="+1 555 123 4567">

<label>Service</label>
<input id="service" required placeholder="House Cleaning">

<label>Follow-up date & time</label>
<input id="followup" type="datetime-local" required>

<label>Notes</label>
<textarea id="notes" placeholder="Customer wants a quote..."></textarea>

<button class="primary" type="submit">ADD LEAD</button>
</form>
</div>

<div class="card">
<div class="stats">
<div class="stat"><strong id="total">0</strong>Total</div>
<div class="stat"><strong id="pending">0</strong>Pending</div>
<div class="stat"><strong id="won">0</strong>Won</div>
</div>
</div>

<div class="card">
<h2>Leads</h2>
<div id="leads"></div>
</div>
</div>

<div id="notice" class="notice"></div>

<script>
"use strict";

const STORAGE_KEY = "followup_leads_v1";

function loadLeads(){
  try{
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  }catch(e){ return []; }
}

function saveLeads(leads){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(leads));
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function makeMessage(name, service){
  return `Hi ${name}, this is the team at our business. Sorry we missed your call. I saw that you were interested in ${service}. How can we help?`;
}

function showNotice(text){
  const n=document.getElementById("notice");
  n.textContent=text;
  n.style.display="block";
  clearTimeout(window.noticeTimer);
  window.noticeTimer=setTimeout(()=>n.style.display="none",1800);
}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      showNotice("Message copied!");
      return;
    }
  }catch(e){}

  const area=document.createElement("textarea");
  area.value=text;
  area.style.position="fixed";
  area.style.left="-9999px";
  document.body.appendChild(area);
  area.focus();
  area.select();
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){}
  area.remove();

  if(ok) showNotice("Message copied!");
  else showNotice("Copy failed — select and copy the message manually.");
}

function formatDate(value){
  const d=new Date(value);
  if(isNaN(d.getTime())) return value;
  return d.toLocaleString([],{
    month:"short",day:"2-digit",year:"numeric",
    hour:"2-digit",minute:"2-digit"
  });
}

function currentStatus(lead){
  if(lead.status==="NEW"){
    const d=new Date(lead.followup);
    if(!isNaN(d.getTime()) && d.getTime() <= Date.now()) return "FOLLOW UP";
  }
  return lead.status;
}

function render(){
  let leads=loadLeads();

  let changed=false;
  leads.forEach(l=>{
    const s=currentStatus(l);
    if(s!==l.status){l.status=s;changed=true}
  });
  if(changed) saveLeads(leads);

  leads.sort((a,b)=>String(a.followup).localeCompare(String(b.followup)));

  document.getElementById("total").textContent=leads.length;
  document.getElementById("pending").textContent=
    leads.filter(l=>["NEW","FOLLOW UP"].includes(l.status)).length;
  document.getElementById("won").textContent=
    leads.filter(l=>l.status==="WON").length;

  const box=document.getElementById("leads");

  if(!leads.length){
    box.innerHTML='<div class="empty">No leads yet.<br>Add your first lead above.</div>';
    return;
  }

  box.innerHTML=leads.map(l=>`
    <div class="lead">
      <h3>${escapeHTML(l.name)}</h3>
      <div class="meta">📞 ${escapeHTML(l.phone || "No phone")}</div>
      <div class="meta">🔧 ${escapeHTML(l.service)}</div>
      <div class="meta">⏰ ${escapeHTML(formatDate(l.followup))}</div>
      <span class="status">${escapeHTML(currentStatus(l))}</span>
      ${l.notes ? `<div class="meta">📝 ${escapeHTML(l.notes)}</div>` : ""}
      <div class="message">${escapeHTML(l.message)}</div>
      <div class="actions">
        <button class="secondary" onclick="copyLead('${l.id}')">COPY MESSAGE</button>
        ${l.status!=="CONTACTED" ? `<button class="success" onclick="setStatus('${l.id}','CONTACTED')">CONTACTED</button>` : ""}
        ${l.status!=="WON" ? `<button class="success" onclick="setStatus('${l.id}','WON')">WON</button>` : ""}
        ${l.status!=="LOST" ? `<button class="danger" onclick="setStatus('${l.id}','LOST')">LOST</button>` : ""}
        <button class="danger" onclick="deleteLead('${l.id}')">DELETE</button>
      </div>
    </div>
  `).join("");
}

function copyLead(id){
  const lead=loadLeads().find(l=>String(l.id)===String(id));
  if(lead) copyText(lead.message);
}

function setStatus(id,status){
  const leads=loadLeads();
  const lead=leads.find(l=>String(l.id)===String(id));
  if(!lead) return;
  lead.status=status;
  saveLeads(leads);
  render();
}

function deleteLead(id){
  if(!confirm("Delete this lead?")) return;
  saveLeads(loadLeads().filter(l=>String(l.id)!==String(id)));
  render();
}

document.getElementById("leadForm").addEventListener("submit",function(e){
  e.preventDefault();

  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const service=document.getElementById("service").value.trim();
  const followup=document.getElementById("followup").value;
  const notes=document.getElementById("notes").value.trim();

  if(!name || !service || !followup){
    showNotice("Please fill the required fields.");
    return;
  }

  const leads=loadLeads();

  leads.push({
    id: Date.now().toString(),
    name,phone,service,followup,notes,
    status:"NEW",
    message:makeMessage(name,service)
  });

  saveLeads(leads);
  this.reset();
  render();
  showNotice("Lead added!");
});

render();
setInterval(render,30000);
</script>
</body>
</html>
