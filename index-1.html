<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FollowUp</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fb;
    color: #18212f;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 16px;
}

.card {
    background: white;
    border: 1px solid #e4e7ec;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
}

h1 {
    margin: 0 0 5px;
}

.subtitle {
    color: #667085;
    margin-bottom: 18px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #d0d5dd;
    border-radius: 9px;
    font-size: 15px;
}

textarea {
    min-height: 70px;
    resize: vertical;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 11px 14px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px 3px 0 0;
}

.add {
    width: 100%;
    background: #18212f;
    color: white;
    margin-top: 14px;
}

.copy {
    background: #e9efff;
}

.delete {
    background: #fee4e2;
    color: #b42318;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.stat {
    text-align: center;
    background: #f8f9fc;
    padding: 10px;
    border-radius: 9px;
}

.stat b {
    display: block;
    font-size: 22px;
}

.lead {
    border-top: 1px solid #eaecf0;
    padding: 15px 0;
}

.lead:first-child {
    border-top: 0;
}

.lead-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.customer-name {
    font-weight: bold;
    font-size: 17px;
}

.badge {
    background: #eef2f6;
    padding: 5px 8px;
    border-radius: 20px;
    font-size: 12px;
}

.message {
    background: #f8f9fc;
    padding: 10px;
    border-radius: 8px;
    margin: 10px 0;
    white-space: pre-wrap;
}

.empty {
    text-align: center;
    color: #667085;
    padding: 20px;
}

@media (max-width: 650px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>FollowUp</h1>

        <div class="subtitle">
            Simple lead follow-up for service businesses. No CRM required.
        </div>

        <div class="grid">

            <div class="full">

                <label>Business name</label>

                <input
                    id="businessName"
                    type="text"
                    placeholder="e.g. ABC Cleaning"
                >

            </div>

            <div>

                <label>Customer name</label>

                <input
                    id="customerName"
                    type="text"
                    placeholder="John"
                >

            </div>

            <div>

                <label>Phone</label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="+1 555 123 4567"
                >

            </div>

            <div>

                <label>Service</label>

                <input
                    id="service"
                    type="text"
                    placeholder="House cleaning"
                >

            </div>

            <div>

                <label>Follow-up date & time</label>

                <input
                    id="followUp"
                    type="datetime-local"
                >

            </div>

            <div class="full">

                <label>Notes</label>

                <textarea
                    id="notes"
                    placeholder="What did the customer ask for?"
                ></textarea>

            </div>

        </div>

        <button class="add" onclick="addLead()">
            + ADD LEAD
        </button>

    </div>


    <div class="card">

        <div class="stats">

            <div class="stat">
                <b id="total">0</b>
                Total
            </div>

            <div class="stat">
                <b id="newCount">0</b>
                New
            </div>

            <div class="stat">
                <b id="dueCount">0</b>
                Due
            </div>

            <div class="stat">
                <b id="wonCount">0</b>
                Won
            </div>

        </div>

    </div>


    <div class="card">

        <h2 style="margin-top:0;">
            Leads
        </h2>

        <div id="leadsList"></div>

    </div>

</div>


<script>

let leads = JSON.parse(
    localStorage.getItem("followup_leads") || "[]"
);


/* BUSINESS NAME */

const businessInput =
    document.getElementById("businessName");

businessInput.value =
    localStorage.getItem("followup_business") || "";

businessInput.addEventListener("input", function () {

    localStorage.setItem(
        "followup_business",
        businessInput.value.trim()
    );

    render();

});


/* HTML ESCAPE */

function escapeHTML(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* SAVE */

function saveLeads() {

    localStorage.setItem(
        "followup_leads",
        JSON.stringify(leads)
    );

    render();

}


/* ADD LEAD */

function addLead() {

    const name =
        document.getElementById("customerName")
        .value.trim();

    const phone =
        document.getElementById("phone")
        .value.trim();

    const service =
        document.getElementById("service")
        .value.trim();

    const followUp =
        document.getElementById("followUp")
        .value;

    const notes =
        document.getElementById("notes")
        .value.trim();


    if (!name || !phone) {

        alert(
            "Please enter customer name and phone."
        );

        return;

    }


    const lead = {

        id: Date.now(),

        name: name,

        phone: phone,

        service: service,

        followUp: followUp,

        notes: notes,

        status: "NEW",

        createdAt: new Date().toISOString()

    };


    leads.unshift(lead);

    saveLeads();


    document.getElementById("customerName").value = "";

    document.getElementById("phone").value = "";

    document.getElementById("service").value = "";

    document.getElementById("followUp").value = "";

    document.getElementById("notes").value = "";

}


/* MESSAGE */

function createMessage(lead) {

    const business =
        localStorage.getItem("followup_business")
        || "our team";


    let serviceText = "";

    if (lead.service) {

        serviceText =
            " about your " +
            lead.service +
            " request";

    }


    return (
        "Hi " +
        lead.name +
        ", this is " +
        business +
        ". Sorry we missed you. " +
        "I’m following up" +
        serviceText +
        ". Are you still interested?"
    );

}


/* COPY MESSAGE */

function copyMessage(id) {

    const lead =
        leads.find(function(item) {
            return item.id === id;
        });


    if (!lead) return;


    const message =
        createMessage(lead);


    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(message)
            .then(function() {

                alert("Message copied.");

            });

    } else {

        const textarea =
            document.createElement("textarea");

        textarea.value = message;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        alert("Message copied.");

    }

}


/* CHANGE STATUS */

function changeStatus(id, newStatus) {

    const lead =
        leads.find(function(item) {
            return item.id === id;
        });


    if (!lead) return;


    lead.status = newStatus;

    saveLeads();

}


/* DELETE */

function deleteLead(id) {

    if (
        !confirm(
            "Delete this lead?"
        )
    ) {
        return;
    }


    leads =
        leads.filter(function(item) {
            return item.id !== id;
        });


    saveLeads();

}


/* RENDER */

function render() {

    const now = Date.now();


    leads.forEach(function(lead) {

        if (
            lead.status === "NEW" &&
            lead.followUp
        ) {

            const followUpTime =
                new Date(
                    lead.followUp
                ).getTime();


            if (
                followUpTime <= now
            ) {

                lead.status =
                    "FOLLOW UP";

            }

        }

    });


    document.getElementById("total")
        .textContent = leads.length;


    document.getElementById("newCount")
        .textContent =
        leads.filter(function(lead) {
            return lead.status === "NEW";
        }).length;


    document.getElementById("dueCount")
        .textContent =
        leads.filter(function(lead) {
            return lead.status === "FOLLOW UP";
        }).length;


    document.getElementById("wonCount")
        .textContent =
        leads.filter(function(lead) {
            return lead.status === "WON";
        }).length;


    const list =
        document.getElementById("leadsList");


    if (leads.length === 0) {

        list.innerHTML =
            '<div class="empty">' +
            'No leads yet. Add your first lead above.' +
            '</div>';

        return;

    }


    list.innerHTML =
        leads.map(function(lead) {

            let followUpHTML = "";

            if (lead.followUp) {

                followUpHTML =
                    "<div><b>Follow-up:</b> " +
                    escapeHTML(
                        new Date(
                            lead.followUp
                        ).toLocaleString()
                    ) +
                    "</div>";

            }


            let serviceHTML = "";

            if (lead.service) {

                serviceHTML =
                    "<div><b>Service:</b> " +
                    escapeHTML(
                        lead.service
                    ) +
                    "</div>";

            }


            let notesHTML = "";

            if (lead.notes) {

                notesHTML =
                    "<div><b>Notes:</b> " +
                    escapeHTML(
                        lead.notes
                    ) +
                    "</div>";

            }


            return (

                '<div class="lead">' +

                    '<div class="lead-header">' +

                        '<div>' +

                            '<div class="customer-name">' +
                            escapeHTML(lead.name) +
                            '</div>' +

                            escapeHTML(lead.phone) +

                        '</div>' +

                        '<span class="badge">' +
                        escapeHTML(lead.status) +
                        '</span>' +

                    '</div>' +

                    serviceHTML +

                    followUpHTML +

                    notesHTML +

                    '<div class="message">' +
                    escapeHTML(
                        createMessage(lead)
                    ) +
                    '</div>' +

                    '<button class="copy" ' +
                    'onclick="copyMessage(' +
                    lead.id +
                    ')">' +
                    'COPY MESSAGE' +
                    '</button>' +

                    '<button onclick="changeStatus(' +
                    lead.id +
                    ', \'CONTACTED\')">' +
                    'CONTACTED' +
                    '</button>' +

                    '<button onclick="changeStatus(' +
                    lead.id +
                    ', \'WON\')">' +
                    'WON' +
                    '</button>' +

                    '<button onclick="changeStatus(' +
                    lead.id +
                    ', \'LOST\')">' +
                    'LOST' +
                    '</button>' +

                    '<button class="delete" ' +
                    'onclick="deleteLead(' +
                    lead.id +
                    ')">' +
                    'DELETE' +
                    '</button>' +

                '</div>'

            );

        }).join("");


    localStorage.setItem(
        "followup_leads",
        JSON.stringify(leads)
    );

}


/* START */

render();


/* CHECK DUE LEADS */

setInterval(
    render,
    30000
);

</script>

</body>
</html>
